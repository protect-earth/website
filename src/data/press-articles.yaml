articles:
  - title: '1,000 trees hit by dry summer in Wales need to be replanted'
    source: 'County Times'
    url: 'https://www.countytimes.co.uk/news/26756777.1-000-trees-hit-dry-summer-wales-need-replanted/'
    image: '../assets/press/county-times-goytre-wood.jpg'
    imageAlt: 'Young trees growing in protective guards on the Powys hillside'
    description: 'The County Times reports on Protect Earth replanting 1,000 native trees near Knighton after many saplings struggled through a difficult summer.'
    date: '2026-11-24'

  - title: 'Volunteers clear invasive plants from woodland'
    source: 'BBC News'
    url: 'https://www.bbc.co.uk/news/articles/cmn9r7nzdw2jo'
    image: '../assets/press/bbc-greenham-woodland.jpg'
    imageAlt: 'Volunteers stand together on cleared rhododendrons'
    description: 'BBC News reports on volunteers clearing invasive rhododendron and cherry laurel from a woodland in Greenham with Protect Earth.'
    date: '2026-10-23'

  - title: "Summer Fair to showcase High Wood's woodland revival project"
    source: 'Cornish Times'
    url: 'https://www.cornish-times.co.uk/news/summer-fair-to-showcase-high-woods-woodland-revival-project-913308'
    image: '../assets/press/cornish-times-summer-fair-2026.jpeg'
    imageAlt: 'High Wood Summer Fair returns to Liskeard on Sunday, June 14'
    description: 'The Cornish Times covers High Wood Summer Fair, which celebrates the ongoing restoration of ancient woodland and invites families to a free day of activities in Liskeard.'
    date: '2026-06-03'

  - title: 'Charity enjoys highly successful summer fair at High Wood'
    source: 'Cornish Times'
    url: 'https://www.cornish-times.co.uk/news/charity-enjoys-highly-successful-summer-fair-at-high-wood-805939'
    image: '../assets/press/cornish-times-summer-fair-2025.jpg'
    imageAlt: ''
    description: 'Protect Earth held our third annual High Wood Summer Fair and the The Cornish Times were on hand to capture all the fun and excitement that everyone experienced.'
    date: '2025-06-25'

  - title: 'Reforestation and flood defense at Goytre Wood'
    source: 'The Times'
    url: 'https://www.thetimes.com/uk/environment/article/reforestation-flood-defence-farmers-times-earth-8wgzqjdg7'
    image: '../assets/press/press-times.webp'
    imageAlt: ''
    description: "Phil and Steve talk about how trees can help absorb and slow down rainwater at Goytre Wood - the damage and effect of which too much has been seen in near by Tenbury Wells - one of the UK's most flooded towns."
    date: '2025-03-06'

