members:
  - name: Phil Sturgeon
    role: Chair
    image: /team-phil.jpg
    imageAlt: ''
    bio: |
      Phil is a software engineer by trade, and the only person on the team
      without a dog. This might need to change. Phil grew up between Bristol and
      Bath, and moved to New York City to "make it big" in tech. After spending
      some time trying to save the world with a carpooling app, he ended up
      working for a company that sold expensive co-working spaces, and realised
      he wasn't doing much to help fight for the climate anymore.

      Escaping the concrete jungle of New York City, Phil spent the next 2 years
      cycling around Europe as a bike nomad, fundraising 100,000 trees with
      various charities, and pushing people to get their carbon footprint as low
      as possible. Protect Earth was a logical extension of those goals, as Phil
      now cycles from site to site, putting up fences, weeding, planting trees,
      then off on the bike to the next one.

  - name: Andy Herd
    role: Trustee
    image: /team-andy.jpg
    imageAlt: ''
    bio: |
      Andy is a software engineer based in West Lothian, Scotland.

      Prior to Protect Earth he coordinated a whitewater canoe slalom
      competition for many years and also volunteered with Livingston Round
      Table, helping to raise £100,000 for local charities and good causes.

      He enjoys spending time enjoying the great British outdoors and he's
      passionate about fighting climate change to ensure that future generations
      can continue to enjoy this beautiful planet.

  - name: Julian Cheal
    role: Trustee
    image: /team-julian.jpg
    imageAlt: ''
    bio: |
      Julian is a software engineer based in Bath, England. Originally hailing from
      the Welsh Valleys. He enjoys making and playing music and if the weather is nice
      running and cycling. At home he has an Air Source Heat Pump, and is looking at installing
      Solar and battery storage to help reduce his climate impact.

      As a trustee he helps the charity navigate the tech landscape to help make sure it is
      using technology as efficiently as it can. He also enjoys visiting Protect Earth sites
      helping with odd jobs and keeping the tea flowing.

  - name: Andrew Heald
    role: Trustee
    image: /team-andrew.jpg
    imageAlt: ''
    bio: |
      Andrew has worked in this sector for more than 20 years, and with a range of organisations from forest product companies like UPM and Mondi to the World Wildlife Federation, the Forest Stewardship Council and the World Business Council for Sustainable Development. Currently he works with a trade organisation called the UK Confederation of Forest Industries. A lot of his work centers on forest certification in the UK—how to make certification simpler, more robust and risk-based, and how to incorporate remote sensing to reduce auditing costs.

  - name: Steve Wiltshire
    role: Ecologist
    image: /team-steve.jpg
    imageAlt: ''
    bio: |
      Steve has been fascinated with the natural world since childhood. He has
      worked in nature conservation for 15 years with organisations such as the
      Royal Society for the Protection of Birds, The Wildlife Trusts and Natural
      England. He enjoys reading and writing about wildlife, and has written
      numerous articles for 'Birdwatching' magazine. Steve currently lives in
      rural Herefordshire where he enjoys looking for butterflies, dragonflies,
      and birds… often accompanied by his Jack Russell 'Stanley Kubrick.'

  - name: Kathy Sturgeon
    role: Events Coordinator
    image: /team-kathy.jpg
    imageAlt: ''
    bio: |
      Kathy is a retired primary school teacher who was her school's
      environmental education subject leader. As a Brownie Guider and pack
      holiday advisor for many years Kathy was able to share her love of nature
      outside the school environment too. Nowadays, when she is not enjoying her
      own garden and family time, she volunteers with Protect Earth as Events
      Organiser.

  - name: Angus Mundin
    role: Site Inspector
    image: /team-angus.jpg
    imageAlt: ''
    bio: |
      Angus is a Bath, Somerset local through and through, passionate about the area he calls home.

      At Protect Earth, you'll find Angus getting involved with planting and maintenance with everyone. But his main mission is facilitating updates to evidence how things are going on the ground at our projects nationwide. He visits sites the charity has worked on to survey how the trees are getting on, taking photos and videos to report back to the charity and the public.

      Angus met Phil at a BBQ after a volunteer event and has been following him around ever since, always looking to getting involved in the next project or adventure.

  - name: Ania Zydron
    role: Project Manager
    image: /team-ania.jpg
    imageAlt: ''
    bio: |
      Ania left London and a background in the creative arts for Somerset, driven by the intention to support landscape-level change. Wanting to nurture the land that had become her companion on evening walks, she set out to find the owner—serendipitously meeting Phil and discovering Protect Earth had just completed the purchase of what is now Warleigh Nature Reserve.

      Guided by ecopsychology and psycholinguistics, Ania views the world through a lens of relationality. As Project Manager, she applies this integrative thinking, helping landowners bring their visions of a greener world to life.

      A keen solo adventurer, explorer, and year-round cyclist, Ania’s greatest pleasure is greeting the day with the dawn chorus.

  - name: Becca Jones
    role: Administrator
    image: /team-becca.jpg
    imageAlt: ''
    bio: |
      Becca is a disabled artist who loves nature, and is involved in local LGBTQIA+ community work, as well as helping Protect Earth with admin.
